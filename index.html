<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BJJ Coach">
<title>BJJ Personal Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand">BJJ <span>Coach</span></div>
  <h1 id="screen-title">Inicio</h1>
  <button class="icon-btn" id="btn-coach" aria-label="Entrenador personal">🥋</button>
</header>

<main id="view" tabindex="-1"></main>

<button class="fab" id="fab" aria-label="Registrar entrenamiento">+ Registrar</button>

<nav class="tabbar" id="tabbar">
  <a href="#/inicio" data-tab="inicio"><i>⌂</i><span>Inicio</span></a>
  <a href="#/entrenos" data-tab="entrenos"><i>✎</i><span>Entrenos</span></a>
  <a href="#/juego" data-tab="juego"><i>◎</i><span>Mi juego</span></a>
  <a href="#/stats" data-tab="stats"><i>▥</i><span>Estadísticas</span></a>
  <a href="#/mas" data-tab="mas"><i>⋯</i><span>Más</span></a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="stats.js"></script>
<script src="core.js"></script>
<script src="training.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
