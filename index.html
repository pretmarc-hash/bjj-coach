<!doctype html>
<html lang="es">
<head>

<body>
<header class="topbar">
  <div class="brand" id="brand" aria-label="BJJ Coach"><b>B</b></div>
  <h1 id="screen-title">Inicio</h1>
  <button class="icon-btn" id="btn-coach" aria-label="Entrenador personal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
</header>

<main id="view" tabindex="-1"></main>

<button class="fab" id="fab" aria-label="Registrar entrenamiento"></button>

<nav class="tabbar" id="tabbar">
  <a href="#/inicio" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
  <a href="#/entrenos" data-tab="bjj"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3M8 14l-3 3M16 14l3 3"/></svg><span>BJJ</span></a>
  <a href="#/gym" data-tab="gym"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg><span>Gym</span></a>
  <a href="#/nutri" data-tab="nutri"><svg viewBox="0 0 24 24"><path d="M12 7c-3-3-8-1-7 5 1 5 4 9 7 8 3 1 6-3 7-8 1-6-4-8-7-5z"/><path d="M12 7c0-2 1-4 3-5"/></svg><span>Comida</span></a>
  <a href="#/mas" data-tab="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>Más</span></a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
